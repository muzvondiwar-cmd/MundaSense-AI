[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mundasense-ai"
version = "0.1.0"
description = "Offline-first, explainable maize yield-risk decision support."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "MundaSense AI contributors" }]
dependencies = [
  "fastapi==0.141.1",
  "joblib==1.6.0",
  "matplotlib==3.11.1",
  "numpy==2.5.2",
  "pandas==3.0.5",
  "PyYAML==6.0.3",
  "pydantic==2.13.5",
  "scikit-learn==1.9.0",
  "streamlit==1.62.0",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.16.5"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mundasense = ["advisory/*.yml", "i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data", "models", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"pages/*.py" = ["E402"]
